name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: >-
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
      - run: .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m pytest -q tests
      - run: swift build --package-path macapp/Shell -c release --arch arm64
