name: Screen Organizer

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Layout, editor and macOS package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check build architecture and release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = "$BUILD_ARCH"
          if [ "$REF_TYPE" = tag ]; then
            VERSION=$(python macapp/release.py version --tag "$REF_NAME")
          else
            VERSION=$(python macapp/release.py version)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install locked development dependencies
        run: |
          LOCK="$PWD/requirements-build.lock"
          WHEEL_LINKS=()
          if [ "$BUILD_ARCH" = x86_64 ]; then
            bash macapp/prepare_intel.sh python "$PWD/build/dependencies/x86_64"
            LOCK="$PWD/build/dependencies/x86_64/requirements-build.lock"
            WHEEL_LINKS=(--find-links "$PWD/build/dependencies/x86_64/wheels")
          fi
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: "${WHEEL_LINKS[@]}" -r "$LOCK"
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv/bin/python -m pip check
          .venv/bin/home-screen-organizer --help
          .venv/bin/python - <<'PYTHON'
          from cryptography.hazmat.primitives import hashes
          digest = hashes.Hash(hashes.SHA256())
          digest.update(b"abc")
          assert digest.finalize().hex() == "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
          PYTHON
      - name: Validate shared translation catalogs
        run: .venv/bin/python tools/check_translations.py
      - name: Validate layouts, draft edits, backups and editor routes
        run: .venv/bin/python -m pytest -q tests
      - name: Locate the release Python distribution
        run: python macapp/native_sources.py --arch "$BUILD_ARCH" --destination "$RUNNER_TEMP/release-python"
      - name: Build and verify the Mac app
        env:
          HOMESCREEN_BUILD_PYTHON: ${{ runner.temp }}/release-python/bin/python3.12
          HOMESCREEN_BUILD_ARCH: ${{ matrix.arch }}
        run: |
          macapp/build.sh
          APP="$PWD/build/$BUILD_ARCH/Screen Organizer.app"
          python macapp/release.py check-localization --app "$APP"
          "$APP/Contents/Resources/engine/engine" --help
          test -f "$APP/Contents/Resources/engine/_internal/homescreen/web/index.html"
          test -f "$APP/Contents/Resources/engine/_internal/homescreen/simulator_icon.m"
          cmp LICENSE "$APP/Contents/Resources/LICENSE"
          lipo "$APP/Contents/MacOS/HomeScreenOrganizer" -verify_arch "$BUILD_ARCH"
          lipo "$APP/Contents/Resources/engine/engine" -verify_arch "$BUILD_ARCH"
          codesign --verify --deep --strict "$APP"
          hdiutil verify build/"$BUILD_ARCH"/home-screen-organizer-*.dmg
      - name: Check packaged MCP initialization and tools
        run: python macapp/check_mcp.py -- "build/$BUILD_ARCH/Screen Organizer.app/Contents/Resources/engine/engine" mcp
      - name: Verify release archives and checksums
        run: |
          ditto -x -k build/release/"$BUILD_ARCH"/home-screen-organizer-*-macos-"$BUILD_ARCH".zip "$RUNNER_TEMP/home-screen-organizer-archive"
          python macapp/release.py check-localization --app "$RUNNER_TEMP/home-screen-organizer-archive/Screen Organizer.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/home-screen-organizer-archive/Screen Organizer.app"
          python macapp/check_mcp.py -- "$RUNNER_TEMP/home-screen-organizer-archive/Screen Organizer.app/Contents/Resources/engine/engine" mcp
          cd build/release/"$BUILD_ARCH"
          shasum -a 256 --check SHA256SUMS.txt
      - name: Upload matching native source inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-screen-organizer-sources-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/source-inputs.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload installable archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-screen-organizer-macos-${{ matrix.arch }}
          path: build/release/${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble standalone MCP distribution
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: home-screen-organizer-*
          path: artifacts
          merge-multiple: false
      - name: Verify native archives and assemble MCP bundle
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          python macapp/release.py collect --tag "v$VERSION" --input-dir "$PWD/artifacts" --output-dir "$PWD/release"
          python macapp/mcp_bundle.py --assets-dir "$PWD/release" --output-dir "$PWD/release" --repository "$REPOSITORY"
          python macapp/source_archive.py assemble --inputs "$PWD/artifacts" --release "$PWD/release" --version "$VERSION" --commit "$GITHUB_SHA" --repository "$REPOSITORY"
          python macapp/release.py verify --tag "v$VERSION" --commit "$GITHUB_SHA" --repository "$REPOSITORY" --input-dir "$PWD/release"
          cd release
          sha256sum --check SHA256SUMS.txt
          python -m zipfile -e home-screen-organizer-*-macos.mcpb "$RUNNER_TEMP/mcpb-manifest"
      - name: Validate official MCPB manifest and Registry metadata
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/mcpb" @anthropic-ai/mcpb@2.1.2
          "$RUNNER_TEMP/mcpb/node_modules/.bin/mcpb" validate "$RUNNER_TEMP/mcpb-manifest/manifest.json"
          curl --fail --location --retry 3 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/publisher"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/publisher" mcp-publisher
          "$RUNNER_TEMP/publisher/mcp-publisher" validate "$PWD/release/server.json"
      - name: Upload complete distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-screen-organizer-distribution
          path: release/*
          if-no-files-found: error
          retention-days: 14

  mcp-bundle:
    name: Native standalone MCP bundle (${{ matrix.arch }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: home-screen-organizer-distribution
          path: release
      - name: Extract and initialize the native bundled engine
        run: |
          test "$(uname -m)" = "$BUILD_ARCH"
          cd release
          shasum -a 256 --check SHA256SUMS.txt
          ditto -x -k home-screen-organizer-*-macos.mcpb "$RUNNER_TEMP/mcpb"
          cd ..
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          source = Path("homescreen/web/locales")
          target = Path(os.environ["RUNNER_TEMP"]) / "mcpb/server" / os.environ["BUILD_ARCH"] / "_internal/homescreen/web/locales"
          manifest = json.loads((source / "manifest.json").read_text())
          for name in ["manifest", *(item["code"] for item in manifest["languages"])]:
              assert (target / f"{name}.json").read_bytes() == (source / f"{name}.json").read_bytes()
          PYTHON
          lipo "$RUNNER_TEMP/mcpb/server/$BUILD_ARCH/engine" -verify_arch "$BUILD_ARCH"
          codesign --verify --deep --strict "$RUNNER_TEMP/mcpb/server/$BUILD_ARCH/engine"
          python macapp/check_mcp.py -- /bin/sh "$RUNNER_TEMP/mcpb/server/launch.sh"

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, mcp-bundle]
    outputs:
      version: ${{ needs.test.outputs.version }}
    concurrency:
      group: publish-${{ github.repository }}-${{ needs.test.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: home-screen-organizer-distribution
          path: release
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.test.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: bash macapp/publish_release.sh "$PWD/release" "$PWD/macapp/RELEASE_NOTES.md"

  registry:
    name: Publish official MCP Registry package
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: registry-${{ github.repository }}-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read metadata from the published release
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.release.outputs.version }}
        run: |
          HAS_METADATA=$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | index("server.json") != null')
          echo "available=$HAS_METADATA" >> "$GITHUB_OUTPUT"
          if [ "$HAS_METADATA" = true ]; then
            mkdir released
            gh release download "$RELEASE_TAG" --pattern server.json --dir released
          else
            echo "Retained release has no standalone MCP package metadata."
          fi
      - name: Verify pinned publisher and publish through OIDC
        if: steps.metadata.outputs.available == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/publisher"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/publisher" mcp-publisher
          MCP_PUBLISHER="$RUNNER_TEMP/publisher/mcp-publisher" bash macapp/publish_registry.sh "$PWD/released/server.json"
