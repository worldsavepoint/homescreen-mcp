name: iOS Home Screen Organizer

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Layout, editor and macOS package
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check build architecture and release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          if [ "$REF_TYPE" = tag ]; then
            VERSION=$(python macapp/release.py version --tag "$REF_NAME")
          else
            VERSION=$(python macapp/release.py version)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install locked development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv/bin/python -m pip check
          .venv/bin/ios-homescreen-organizer --help
      - name: Validate layouts, draft edits, backups and editor routes
        run: .venv/bin/python -m pytest -q tests
      - name: Build and verify the Mac app
        env:
          HOMESCREEN_BUILD_PYTHON: python
        run: |
          macapp/build.sh
          APP="$PWD/build/iOS Home Screen Organizer.app"
          "$APP/Contents/Resources/engine/engine" --help
          test -f "$APP/Contents/Resources/engine/_internal/homescreen/web/index.html"
          test -f "$APP/Contents/Resources/engine/_internal/homescreen/simulator_icon.m"
          cmp LICENSE "$APP/Contents/Resources/LICENSE"
          codesign --verify --deep --strict "$APP"
          hdiutil verify build/ios-homescreen-organizer-*.dmg
      - name: Assemble release archives and checksums
        run: |
          python macapp/release.py package
          ditto -x -k build/release/ios-homescreen-organizer-*-macos-arm64.zip "$RUNNER_TEMP/ios-homescreen-organizer-archive"
          codesign --verify --deep --strict "$RUNNER_TEMP/ios-homescreen-organizer-archive/iOS Home Screen Organizer.app"
          cd build/release
          shasum -a 256 --check SHA256SUMS.txt
      - name: Upload installable archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-homescreen-organizer-macos-arm64
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    concurrency:
      group: publish-${{ github.repository }}-${{ needs.test.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-homescreen-organizer-macos-arm64
          path: release
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.test.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: bash macapp/publish_release.sh "$PWD/release" "$PWD/macapp/RELEASE_NOTES.md"
